services:

  sqlserver:
    container_name: filevault-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "FileVault@2024!"
      ACCEPT_EULA: "Y"
    ports:
      - "11433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    container_name: filevault-api
    build:
      context: ..
      dockerfile: src/FileVault.API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FileVaultDb;User Id=sa;Password=FileVault@2024!;TrustServerCertificate=True
      - StorageSettings__Provider=Local
      - StorageSettings__Local__RootPath=/app/uploads
    volumes:
      - file_uploads:/app/uploads

volumes:
  sqlserver_data:
  file_uploads:
